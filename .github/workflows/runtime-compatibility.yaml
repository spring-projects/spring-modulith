name: Runtime Compatibility Build

# Compiles the examples against the dependency versions Spring Modulith is built with
# and then executes the tests against the versions listed in etc/runtime-versions.properties
# to verify binary compatibility with more recent versions.

on:
  workflow_dispatch:
  schedule:
    - cron: '35 6 * * *'

jobs:
  runtime:
    if: github.repository == 'spring-projects/spring-modulith'
    name: Run examples against newer dependency versions
    runs-on: ubuntu-latest

    steps:

    - name: Check out sources
      uses: actions/checkout@v6

    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: 21
        cache: 'maven'

    - name: Compile examples
      run: |
        cd spring-modulith-examples
        ../mvnw -B clean test-compile

    - name: Apply runtime dependency versions
      run: |
        etc/apply-runtime-versions.sh spring-modulith-examples
        versions=$(grep -vE '^\s*(#|$)' etc/runtime-versions.properties | awk '{ printf "%s%s", sep, $0; sep = "%0A" }')
        echo "::notice title=Runtime dependency versions::${versions}"

    - name: Run examples
      run: |
        cd spring-modulith-examples
        ../mvnw -B dependency:list surefire:test -Dsort
